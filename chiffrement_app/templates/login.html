{% extends 'base.html' %}

{% block title %}Connexion - Signature Électronique{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card-custom p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px; background: rgba(165, 180, 252, 0.15);">
                    <i class="fa-solid fa-lock fs-3" style="color: var(--token-accent-indigo);"></i>
                </div>
                <h2 class="h3 fw-bold mb-1 text-white">Connexion</h2>
                <p class="text-token-muted small">Accédez à votre espace de signature de documents</p>
            </div>

            {% if error %}
                <div class="alert alert-danger border-0 shadow-sm mb-4">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'chiffrement_app:login' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">Nom d'utilisateur</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 text-token-muted" style="background: var(--token-bg-input); border-color: var(--token-border-strong);">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control form-control-custom border-start-0 ps-0" id="username" name="username" placeholder="votre_pseudo" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 text-token-muted" style="background: var(--token-bg-input); border-color: var(--token-border-strong);">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" class="form-control form-control-custom border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient-primary w-100 py-2 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Se connecter
                </button>
            </form>

            <div class="text-center pt-3 border-top" style="border-color: var(--token-border) !important;">
                <p class="text-token-muted small mb-0">
                    Vous n'avez pas de compte ? 
                    <a href="{% url 'chiffrement_app:register' %}" class="text-decoration-none fw-semibold" style="color: var(--token-accent-indigo);">Créer un compte</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
