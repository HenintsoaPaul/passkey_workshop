{% extends 'base.html' %}

{% block title %}Inscription - Signature Électronique{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-10 col-lg-7">
        <div class="card-custom p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px; background: rgba(236, 72, 153, 0.15);">
                    <i class="fa-solid fa-user-plus fs-3" style="color: #ec4899;"></i>
                </div>
                <h2 class="h3 fw-bold mb-1">Créer un compte</h2>
                <p class="text-muted small">Remplissez vos informations pour rejoindre la plateforme</p>
            </div>

            {% if error %}
                <div class="alert alert-danger border-0 shadow-sm mb-4">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'chiffrement_app:register' %}">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label text-muted small fw-semibold">Nom d'utilisateur *</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 text-muted" style="background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.1);">
                                <i class="fa-solid fa-at"></i>
                            </span>
                            <input type="text" class="form-control form-control-custom border-start-0 ps-0" id="username" name="username" placeholder="johndoe" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label text-muted small fw-semibold">Adresse Email *</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 text-muted" style="background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.1);">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" class="form-control form-control-custom border-start-0 ps-0" id="email" name="email" placeholder="john@example.com" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label text-muted small fw-semibold">Nom complet</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 text-muted" style="background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.1);">
                                <i class="fa-solid fa-id-card"></i>
                            </span>
                            <input type="text" class="form-control form-control-custom border-start-0 ps-0" id="name" name="name" placeholder="John Doe">
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="phone" class="form-label text-muted small fw-semibold">Téléphone</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 text-muted" style="background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.1);">
                                <i class="fa-solid fa-phone"></i>
                            </span>
                            <input type="text" class="form-control form-control-custom border-start-0 ps-0" id="phone" name="phone" placeholder="+261 34 00 000 00">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="address" class="form-label text-muted small fw-semibold">Adresse</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 text-muted" style="background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.1);">
                                <i class="fa-solid fa-location-dot"></i>
                            </span>
                            <input type="text" class="form-control form-control-custom border-start-0 ps-0" id="address" name="address" placeholder="Lot IV 123">
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="city" class="form-label text-muted small fw-semibold">Ville</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 text-muted" style="background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.1);">
                                <i class="fa-solid fa-city"></i>
                            </span>
                            <input type="text" class="form-control form-control-custom border-start-0 ps-0" id="city" name="city" placeholder="Antananarivo">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label for="password" class="form-label text-muted small fw-semibold">Mot de passe *</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 text-muted" style="background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.1);">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" class="form-control form-control-custom border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label for="password_confirm" class="form-label text-muted small fw-semibold">Confirmer le mot de passe *</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 text-muted" style="background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.1);">
                                <i class="fa-solid fa-shield-halved"></i>
                            </span>
                            <input type="password" class="form-control form-control-custom border-start-0 ps-0" id="password_confirm" name="password_confirm" placeholder="••••••••" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient-primary w-100 py-2 mb-3">
                    <i class="fa-solid fa-user-check me-2"></i>Créer mon compte
                </button>
            </form>

            <div class="text-center pt-3 border-top" style="border-color: rgba(255, 255, 255, 0.1) !important;">
                <p class="text-muted small mb-0">
                    Déjà inscrit ? 
                    <a href="{% url 'chiffrement_app:login' %}" class="text-indigo-400 text-decoration-none fw-semibold" style="color: #818cf8;">Se connecter</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
